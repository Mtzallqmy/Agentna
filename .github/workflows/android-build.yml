name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned stable Android SDK components
        shell: bash
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build, unit test and lint
        run: >-
          gradle --no-daemon --stacktrace --warning-mode all
          :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Agentna-ci-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
